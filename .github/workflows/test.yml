name: all-tests
on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: install dependencies
        run: |
          echo "installing dependencies"
          npm ci
      - name: Run lint
        run: |
          echo "running lint"
          npm run lint
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: install dependencies
        run: |
          echo "installing dependencies"
          npm ci
      - name: Run test
        run: |
          echo "running test"
          npm run test
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: install dependencies
        run: |
          echo "installing dependencies"
          npm ci
      - name: Run test
        run: |
          echo "running build"
          npm run build
