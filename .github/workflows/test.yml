name: all-tests
on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "installing dependencies"
          npm ci
      - name: Run lint
        run: |
          echo "running lint"
          npm run lint
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "installing dependencies"
          npm ci
      - name: Run test
        id: run-tests
        run: |
          echo "running test"
          npm run test
      - name: upload test result
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-result-failed
          path: test.json

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "installing dependencies"
          npm ci
      - name: Run build
        run: |
          echo "running build"
          npm run build

  report:
    runs-on: ubuntu-latest
    if: failure()
    needs: [build, lint, test]
    steps:
      - name: something went wrong
        run: |
          echo "somwthing went wrong"
          echo ${{github.repository}}
